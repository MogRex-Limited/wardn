name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so newly disclosed vulnerabilities are caught even without changes.
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Least privilege: jobs get a read-only token unless they ask for more.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test against exactly the Go version under test; never auto-download a
  # different toolchain from the go.mod toolchain line.
  GOTOOLCHAIN: local

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The two Go releases that receive security fixes (design decision D8).
        go: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false # no shared caches: avoids cache-poisoning attacks
      - name: Verify module checksums
        run: go mod verify
      - name: Build
        run: go build ./...
      - name: Test (race detector, shuffled order)
        run: go test -race -shuffle=on -count=1 -covermode=atomic -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1

  lint:
    name: Lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        module: [".", "store/mongo", "store/pgx", "cache/redis", "tests/integration", "examples"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: false
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: ${{ matrix.module }}

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: false
      # The same targets developers run locally, on every module.
      - name: go.mod and go.sum are tidy, and checksums verify
        run: make tidy
      - name: Direct dependencies are allowlisted
        run: make deps
      - name: Known vulnerabilities (govulncheck)
        run: make vuln

  api:
    name: API compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # every release tag, to compare against (docs/STABILITY.md)
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: false
      - name: No incompatible change to the public API since the latest v1 release
        run: make api

  integration:
    name: Integration (real databases)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Images pinned by digest; keep in sync with tests/integration/compose.yaml.
    services:
      postgres:
        image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
        env:
          POSTGRES_PASSWORD: wardn
          POSTGRES_DB: wardn
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
      mysql:
        image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
        env:
          MYSQL_ROOT_PASSWORD: wardn
          MYSQL_DATABASE: wardn
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pwardn" --health-interval 2s --health-retries 60
      mariadb:
        image: mariadb:11.4@sha256:d1891ede5a559f1086f55053bb8cc1569b0298338c4d72d71725a7f74f6ba620
        env:
          MARIADB_ROOT_PASSWORD: wardn
          MARIADB_DATABASE: wardn
        ports: ["3307:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 2s --health-retries 60
      mongo:
        image: mongo:8.0@sha256:b9924c330a8bbc5800fe9c69f04a84e221eca7b28fd049a0354147d9908fa142
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'" --health-interval 2s --health-retries 60
      redis:
        image: redis:7.4-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-retries 30
    env:
      WARDN_TEST_POSTGRES_DSN: postgres://postgres:wardn@127.0.0.1:5432/wardn?sslmode=disable
      WARDN_TEST_MYSQL_DSN: root:wardn@tcp(127.0.0.1:3306)/wardn
      WARDN_TEST_MARIADB_DSN: root:wardn@tcp(127.0.0.1:3307)/wardn
      WARDN_TEST_MONGO_URI: mongodb://127.0.0.1:27017
      WARDN_TEST_REDIS_ADDR: 127.0.0.1:6379
      WARDN_TEST_REQUIRE_ALL: "1" # fail, never skip, if a database is missing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: false
      - name: SQL, MongoDB and Redis modules against real servers
        run: make test-modules

  docs:
    name: Docs site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install exactly the locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Known vulnerabilities in site dependencies
        run: npm audit --audit-level=moderate
      - name: Build, failing on any broken internal link
        run: npm run build
