name: Deep checks

# Slower security checks, run weekly and on demand: a fuzzing campaign over
# every fuzz target, and mutation testing of every security rule
# (scripts/mutate.py). A failure here is a security bug or a missing test.

on:
  schedule:
    - cron: "23 3 * * 0"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Time per fuzz target
        default: 5m

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  fuzz:
    name: Fuzzing campaign
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: false
      - name: Fuzz every target
        env:
          FUZZTIME: ${{ inputs.fuzztime || '5m' }}
        run: ./scripts/fuzz.sh "$FUZZTIME"
      - name: Keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashers
          path: "**/testdata/fuzz/**"

  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: false
      - name: Every security rule is protected by a test
        run: python3 scripts/mutate.py
