name: Release

# Builds the wardn CLI for each platform when a version tag is pushed, and
# publishes the binaries with checksums and signed build provenance, so
# anyone can verify a binary was built from the tagged source by this
# workflow (threat model S04). See docs/MAINTAINING.md, "Releases".

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write     # create the GitHub release
      id-token: write     # sign the provenance with Sigstore
      attestations: write # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: false

      - name: Require a signed, verified tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")
          if [ "$(jq -r .object.type <<<"$ref")" != "tag" ]; then
            echo "::error::$TAG is a lightweight tag; releases need a signed annotated tag (git tag -s)"
            exit 1
          fi
          verified=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$(jq -r .object.sha <<<"$ref")" --jq .verification.verified)
          if [ "$verified" != "true" ]; then
            echo "::error::the signature on $TAG is not verified by GitHub"
            exit 1
          fi

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}
            ext=""; [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -buildid= -X main.releaseVersion=$TAG" \
              -o "dist/wardn_${TAG}_${os}_${arch}${ext}" ./cmd/wardn
          done
          (cd dist && sha256sum -- * > SHA256SUMS)

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/wardn_*

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --verify-tag --title "wardn $TAG" \
            --notes "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/CHANGELOG.md). Verify a binary with: gh attestation verify <file> --repo $GITHUB_REPOSITORY"
